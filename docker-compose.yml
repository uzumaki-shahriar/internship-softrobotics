# Shared local dev orchestration for all 3 systems. They stay completely
# separate applications/codebases (own repo folder, own Dockerfile, own
# package.json/requirements) - this file just brings them up together for
# convenience, on one shared Postgres server so you don't need N separate
# Postgres processes running locally. Each app gets its own database on it
# (and each additional simulated bank instance gets its own too), so there's
# still no cross-system data access - nothing here lets one app query
# another's tables.
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # Comma-separated - add a name here for every app / extra bank
      # instance that should get its own database on this server.
      POSTGRES_MULTIPLE_DATABASES: bank_demo,payment_gateway,ecommerce_shop
    volumes:
      # Postgres 18's image stores data in a versioned subdirectory of
      # /var/lib/postgresql (pg_ctlcluster-style), not .../data directly.
      - postgres_data:/var/lib/postgresql
      - ./docker/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One instance = one bank. To simulate a second bank later: add its
  # database name to POSTGRES_MULTIPLE_DATABASES above, then copy this
  # service block under a new name with a different BANK_NAME/BANK_CODE,
  # DATABASE_URL (pointing at its own database), and host port.
  bank-system:
    build: ./bank-system
    restart: unless-stopped
    environment:
      BANK_NAME: Demo Bank
      BANK_CODE: DEMO001
      BANK_CURRENCY: BDT
      PORT: 8001
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/bank_demo
      BANK_API_KEY: dev-bank-api-key
      SESSION_SECRET: dev-session-secret
      ADMIN_EMAIL: admin@bank.local
      ADMIN_PASSWORD: admin123
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  payment-gateway:
    build: ./payment-system
    restart: unless-stopped
    environment:
      APP_NAME: Payment Gateway
      PORT: 8000
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/payment_gateway
      JWT_SECRET: dev-jwt-secret
      SESSION_SECRET: dev-session-secret
      # Same Docker network as bank-system here (both defined in this one
      # compose file), so the plain service name resolves - no
      # host.docker.internal needed now that they're orchestrated together.
      BANK_API_BASE_URL: http://bank-system:8001
      BANK_API_KEY: dev-bank-api-key
      # The customer-facing address for checkout_url - always the host
      # machine's port, never the internal Docker hostname, since it also
      # gets called by other containers (ecommerce-app) whose Host header
      # a customer's browser could never resolve.
      PUBLIC_BASE_URL: http://localhost:8000
      CHECKOUT_SESSION_TTL_MINUTES: 5
      ADMIN_EMAIL: admin@gateway.local
      ADMIN_PASSWORD: admin123
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      bank-system:
        condition: service_started

  ecommerce-app:
    build: ./ecommerce-app
    restart: unless-stopped
    environment:
      APP_NAME: Bookworm Cafe
      PORT: 3000
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ecommerce_shop
      GATEWAY_BASE_URL: http://payment-gateway:8000
      GATEWAY_CURRENCY: BDT
      # This shop is a separate, independently-run business from the
      # Payment Gateway in this simulation - there is no code anywhere that
      # registers it or logs into the Gateway automatically on its behalf.
      # A human provisions this the same way a real merchant gets a Stripe/
      # SSLCommerz key: register at the Gateway, get approved by ITS admin,
      # then paste the issued key here and restart this one service. See
      # the root README's "Provisioning a merchant" section for the exact
      # steps. This placeholder will make checkout fail until replaced.
      GATEWAY_API_KEY: REPLACE_WITH_YOUR_APPROVED_MERCHANT_API_KEY
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      payment-gateway:
        condition: service_started

volumes:
  postgres_data:
