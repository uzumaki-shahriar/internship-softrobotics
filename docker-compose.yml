# Shared local dev infrastructure. The 3 systems (Bank, Payment Gateway,
# Ecommerce) stay completely separate applications/codebases - this Postgres
# server is just a convenience so you don't need 3 separate Postgres
# processes running locally. Each app gets its own database on it (and each
# additional simulated bank instance gets its own too), so there's still no
# cross-system data access.
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # Comma-separated - add a name here for every app / extra bank
      # instance that should get its own database on this server.
      POSTGRES_MULTIPLE_DATABASES: bank_demo,payment_gateway
    volumes:
      # Postgres 18's image stores data in a versioned subdirectory of
      # /var/lib/postgresql (pg_ctlcluster-style), not .../data directly.
      - postgres_data:/var/lib/postgresql
      - ./docker/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One instance = one bank. To simulate a second bank later: add its
  # database name to POSTGRES_MULTIPLE_DATABASES above, then copy this
  # service block under a new name with a different BANK_NAME/BANK_CODE,
  # DATABASE_URL (pointing at its own database), and host port.
  bank-system:
    build: ./bank-system
    restart: unless-stopped
    environment:
      BANK_NAME: Demo Bank
      BANK_CODE: DEMO001
      BANK_CURRENCY: BDT
      PORT: 8001
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/bank_demo
      BANK_API_KEY: dev-bank-api-key
      SESSION_SECRET: dev-session-secret
      ADMIN_EMAIL: admin@bank.local
      ADMIN_PASSWORD: admin123
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
